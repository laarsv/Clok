# Basis-Compose: Frontend hängt am externen Reverse-Proxy-Netz "proxy-net",
# es werden keine Host-Ports veröffentlicht. Für den lokalen Betrieb zusätzlich
# docker-compose.dev.yml verwenden (Host-Ports, kein externes Netz):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Der Netz-Alias "clok-api" am Backend ist der Upstream-Name in
# frontend/nginx.conf (identisch mit dem container_name in docker-compose.prod.yml).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      TIMEZONE: ${TIMEZONE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      APP_BASE_URL: ${APP_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      GOOGLE_JIT_ROLE: ${GOOGLE_JIT_ROLE:-}
      GOOGLE_JIT_SUPERVISOR_EMAIL: ${GOOGLE_JIT_SUPERVISOR_EMAIL:-}
      EMPLOYER_INVITE_TTL_DAYS: ${EMPLOYER_INVITE_TTL_DAYS:-14}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
    networks:
      internal:
        aliases: [clok-api]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on: [backend]
    networks: [internal, proxy]

volumes:
  db_data:

networks:
  internal:
  proxy:
    external: true
    name: proxy-net
